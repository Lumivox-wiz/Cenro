<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <!-- Main Right Peak Gradient -->
    <linearGradient id="rightPeakGrad" x1="35%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1E3F7A"/>
      <stop offset="45%" stop-color="#355FA3"/>
      <stop offset="85%" stop-color="#5885CC"/>
      <stop offset="100%" stop-color="#87AEE6" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Secondary Left Peak Gradient -->
    <linearGradient id="leftPeakGrad" x1="10%" y1="85%" x2="75%" y2="20%">
      <stop offset="0%" stop-color="#1D4180"/>
      <stop offset="40%" stop-color="#4572BD"/>
      <stop offset="80%" stop-color="#7EA6E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B9D2F5" stop-opacity="0.35"/>
    </linearGradient>
    <!-- Flowing Translucent Ribbon Wave 1 -->
    <linearGradient id="waveRibbon1" x1="0%" y1="50%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="38%" stop-color="#EBF3FF" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#769FDB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4673BD" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Flowing Translucent Ribbon Wave 2 (Underneath Curve) -->
    <linearGradient id="waveRibbon2" x1="15%" y1="30%" x2="95%" y2="85%">
      <stop offset="0%" stop-color="#2D569C" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#6A94D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ADC8F0" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Subtle Edge Highlight -->
    <linearGradient id="ridgeHighlight" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#D4E4FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4A77C2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Back / Right Tall Mountain Peak -->
  <path d="M 168 126
           L 204 54
           C 210 42, 222 42, 231 53
           L 366 196
           C 324 186, 276 162, 230 144
           C 206 135, 186 130, 168 126 Z"
        fill="url(#rightPeakGrad)"/>

  <!-- Soft Light Veil behind Left Peak -->
  <path d="M 142 120
           L 175 62
           C 181 51, 192 51, 200 61
           L 304 182
           C 254 166, 200 140, 142 120 Z"
        fill="url(#waveRibbon1)" opacity="0.6"/>

  <!-- Front / Left Mountain Peak -->
  <path d="M 34 196
           L 132 90
           C 141 80, 154 80, 164 90
           L 284 188
           C 230 162, 174 146, 122 156
           C 88 162, 58 178, 34 196 Z"
        fill="url(#leftPeakGrad)"/>

  <!-- Flowing Translucent Silk Fold Across Both Peaks -->
  <path d="M 176 112
           C 205 116, 235 132, 266 154
           C 298 176, 332 190, 366 196
           C 322 194, 278 182, 238 160
           C 202 140, 172 132, 142 136
           C 154 126, 165 117, 176 112 Z"
        fill="url(#waveRibbon1)"/>

  <!-- Lower Translucent Shadow Fold -->
  <path d="M 94 162
           C 146 142, 198 148, 254 174
           C 292 191, 330 198, 366 196
           C 316 192, 268 172, 224 148
           C 184 126, 142 134, 94 162 Z"
        fill="url(#waveRibbon2)"/>

  <!-- Crisp Specular Ridge Line -->
  <path d="M 177 113
           C 208 118, 238 135, 270 157
           C 302 179, 334 191, 364 195"
        fill="none" stroke="url(#ridgeHighlight)" stroke-width="1.8" stroke-linecap="round"/>
</svg>